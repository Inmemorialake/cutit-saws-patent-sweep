name: CI Backend Patent Sweep

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-and-quality:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: patent-sweep/backend

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          # Historial completo: Sonar lo usa para el blame y para detectar el código nuevo.
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: patent-sweep/backend/pom.xml

      - name: Ejecutar pruebas unitarias y de integración
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Validar cobertura mínima con JaCoCo
        run: mvn --batch-mode --no-transfer-progress jacoco:report jacoco:check

      - name: Inspeccionar estilo con Checkstyle
        run: mvn --batch-mode --no-transfer-progress checkstyle:check

      - name: Construir el artefacto
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Guardar el JAR generado
        uses: actions/upload-artifact@v7
        with:
          name: patent-sweep-${{ github.sha }}
          path: patent-sweep/backend/target/patent-sweep.jar
          if-no-files-found: error

      - name: Caché de SonarCloud
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # La organización, la clave del proyecto y la URL de SonarCloud están en pom.xml.
      - name: Análisis estático de código con SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn --batch-mode --no-transfer-progress sonar:sonar
