AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Patent Sweep - Acceso de GitHub Actions al EC2 sin llaves ni puerto 22 (ADR-007).
  Proveedor OIDC de GitHub, rol de despliegue limitado a SSM Run Command sobre una sola instancia
  y perfil de instancia para que el agente de SSM se registre.

# Despliegue (en la misma región del EC2):
#   aws cloudformation deploy --stack-name patent-sweep-cd \
#     --template-file infra/aws/cd-oidc-ssm.yml --capabilities CAPABILITY_IAM \
#     --parameter-overrides IdInstancia=i-0123456789abcdef0
# Si la cuenta ya tiene el proveedor token.actions.githubusercontent.com, agregue:
#     CrearProveedorOidc=false ArnProveedorOidcExistente=arn:aws:iam::<cuenta>:oidc-provider/token.actions.githubusercontent.com

Parameters:
  RepositorioGitHub:
    Type: String
    Default: Inmemorialake/cutit-saws-patent-sweep
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    Description: dueño/repositorio que puede desplegar.
  EnvironmentGitHub:
    Type: String
    Default: production
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
    Description: Solo los jobs de este environment de GitHub pueden asumir el rol.
  IdInstancia:
    Type: AWS::EC2::Instance::Id
    Description: EC2 donde corre Patent Sweep. El rol solo puede enviar comandos a esta instancia.
  CrearProveedorOidc:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: false si la cuenta ya tiene el proveedor OIDC de GitHub (solo puede existir uno).
  ArnProveedorOidcExistente:
    Type: String
    Default: ""
    Description: ARN del proveedor existente (solo si CrearProveedorOidc=false).

Conditions:
  CrearOidc: !Equals [!Ref CrearProveedorOidc, "true"]

Resources:
  ProveedorOidcGitHub:
    Type: AWS::IAM::OIDCProvider
    Condition: CrearOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # Rol que asume el job "desplegar" de cd.yml. Credenciales temporales (máx. 1 h), sin llaves guardadas.
  RolDespliegueGitHub:
    Type: AWS::IAM::Role
    Properties:
      Description: GitHub Actions (environment de produccion) despliega Patent Sweep por SSM.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CrearOidc, !Ref ProveedorOidcGitHub, !Ref ArnProveedorOidcExistente]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                # Solo este repositorio y este environment (que a su vez solo acepta la rama main).
                "token.actions.githubusercontent.com:sub": !Sub "repo:${RepositorioGitHub}:environment:${EnvironmentGitHub}"
      Policies:
        - PolicyName: enviar-comando-de-despliegue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EnviarComandoSoloAEstaInstancia
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${IdInstancia}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
              # Estas acciones de lectura no admiten restricción por recurso.
              - Sid: LeerResultadoDelComando
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"

  # Rol de la instancia: solo lo necesario para que el agente de SSM se registre y reciba comandos.
  RolInstancia:
    Type: AWS::IAM::Role
    Properties:
      Description: EC2 de Patent Sweep, administrado por AWS Systems Manager.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"

  PerfilInstancia:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref RolInstancia

Outputs:
  ArnRolDespliegue:
    Description: Guárdelo como secreto AWS_ROLE_ARN del environment "production" en GitHub.
    Value: !GetAtt RolDespliegueGitHub.Arn
  NombrePerfilInstancia:
    Description: Perfil que se asocia al EC2 (ver docs/despliegue/EC2.md, sección 5).
    Value: !Ref PerfilInstancia
  ComandoAsociarPerfil:
    Description: Comando para asociar el perfil a la instancia.
    Value: !Sub "aws ec2 associate-iam-instance-profile --instance-id ${IdInstancia} --iam-instance-profile Name=${PerfilInstancia}"
