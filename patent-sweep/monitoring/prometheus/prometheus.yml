# Jobs de recolección de Prometheus (ADR-010). Todo viaja por la red interna de Docker:
# ningún puerto de esta lista se publica fuera del servidor.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # API: peticiones HTTP, latencia, JVM, pool de conexiones, circuit breakers y métricas del barrido.
  # Actuator vive en el puerto de management (MANAGEMENT_PUERTO), no en el puerto público de la API.
  - job_name: patent-sweep-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-patent-sweep:9091"]
        labels:
          servicio: patent-sweep

  # CPU, memoria, disco y red del servidor (EC2).
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          servicio: patent-sweep

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
