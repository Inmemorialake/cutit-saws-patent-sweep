# Override de producción (EC2). Desde Internet solo entran los puertos 80/443 de Caddy (HTTPS, ADR-010);
# la API queda en 127.0.0.1 para el healthcheck del despliegue por SSM. Se usa junto con docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
# La imagen de la API se construye en GitHub Actions y se descarga de GHCR por digest: el servidor no compila.
# Los límites de memoria están pensados para una instancia de 1–2 GB de RAM con 2 GB de swap
# (ver docs/despliegue/EC2.md). Requiere Docker Compose v2.24 o superior (por "!reset").
services:
  postgres:
    mem_limit: 384m

  apis-simuladas:
    mem_limit: 256m
    environment:
      # WireMock corre en la JVM: se limita el heap para que quepa en el límite del contenedor.
      JAVA_OPTS: "-Xmx128m -XX:+UseSerialGC"

  api-patent-sweep:
    # En producción no se construye la imagen: se elimina "build" del archivo base y se usa la de GHCR.
    build: !reset null
    # IMAGE_REF lo escribe el documento SSM PatentSweep-Desplegar (infra/aws/cd-ssm.yml) en imagen.env con el digest exacto (nombre@sha256:...).
    image: ${IMAGE_REF:-ghcr.io/inmemorialake/cutit-saws-patent-sweep:latest}
    pull_policy: missing
    mem_limit: 768m
    # Solo localhost: el tráfico público llega por Caddy con HTTPS.
    ports: !override
      - "127.0.0.1:${API_PUERTO}:${API_PUERTO}"
    environment:
      # Heap acotado para que heap + metaspace + hilos quepan en los 768 MB del contenedor.
      JAVA_TOOL_OPTIONS: "-Xmx448m -XX:MaxMetaspaceSize=160m -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"

  prometheus:
    mem_limit: 384m

  node-exporter:
    mem_limit: 64m

  grafana:
    mem_limit: 256m
    # En producción Grafana no publica puerto: se entra por Caddy.
    ports: !reset []
    environment:
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMINIO}
      GF_SECURITY_COOKIE_SECURE: "true"

  caddy:
    image: caddy:2.11.8-alpine
    environment:
      API_DOMINIO: ${API_DOMINIO}
      GRAFANA_DOMINIO: ${GRAFANA_DOMINIO}
      API_PUERTO: ${API_PUERTO}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./monitoring/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - datos-caddy:/data
      - config-caddy:/config
    depends_on:
      - api-patent-sweep
      - grafana
    networks:
      - patent-sweep-red
    mem_limit: 64m
    restart: unless-stopped

volumes:
  datos-caddy:
  config-caddy:
