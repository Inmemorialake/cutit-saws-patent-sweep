spring:
  application:
    name: patent-sweep
  config:
    import: "optional:file:.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${API_PUERTO}
  error:
    include-stacktrace: never
    include-message: never

# Documentación OpenAPI (P24): Swagger UI en /swagger-ui.html y contrato en /v3/api-docs.
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Actuator + Micrometer (P23, P28): health check y métricas para Prometheus.
# Actuator va en un puerto de management interno que no se publica (ADR-010): Prometheus lo lee por la
# red de Docker. El health público sigue en el puerto de la API (SaludController). Debe ser distinto de API_PUERTO.
management:
  server:
    port: ${MANAGEMENT_PUERTO:9091}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
  # Histograma de latencia HTTP para calcular percentiles (p95) en Grafana.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# traceId en cada línea de log (P19).
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"

# Parámetros propios de Patent Sweep (P21). Restaurados por ADR-008; ningún secreto está en el código.
patentsweep:
  seguridad:
    jwt-secreto: ${JWT_SECRET}
    jwt-expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:60}
    admin-usuario: ${ADMIN_USUARIO:}
    admin-clave: ${ADMIN_CLAVE:}
    servicio-usuario: ${SERVICIO_USUARIO:}
    servicio-clave: ${SERVICIO_CLAVE:}
  materiales:
    url-base: ${MATERIALES_URL:http://apis-simuladas:8080}
  fuente-patentes:
    url-base: ${FUENTE_PATENTES_URL:http://apis-simuladas:8080}
  http:
    # Límite de 20 s por intento HTTP (PB); Resilience4j solo acota la llamada completa (70 s).
    timeout-conexion-segundos: 5
    timeout-lectura-segundos: 20
  coincidencia:
    # Regla del PB (HU-01, criterio 6): al menos el 50 % de los materiales y como mínimo 2.
    porcentaje-minimo: 50
    minimo-materiales: 2
  # Dimensionamiento compartido por los pools independientes de notificaciones e integraciones HTTP.
  async:
    nucleo: 2
    maximo: 4
    cola: 100

# Resilience4j (P10, P25): 3 intentos con 5 s de espera y circuit breaker por API externa.
resilience4j:
  retry:
    instances:
      materiales:
        max-attempts: 3
        wait-duration: 5s
        retry-exceptions:
          - co.edu.univalle.patentsweep.exception.ServicioNoDisponibleException
      materialesVerificacion:
        # PB HU-04: la consulta de estado verifica la fórmula una sola vez y en 5 s como máximo.
        max-attempts: 1
        wait-duration: 5s
      fuentePatentes:
        max-attempts: 3
        wait-duration: 5s
        retry-exceptions:
          - co.edu.univalle.patentsweep.exception.ServicioNoDisponibleException
  timelimiter:
    instances:
      materiales:
        # PB: 20 s por intento (lo aplica timeout-lectura-segundos). Este tope solo protege la llamada
        # lógica completa: 3 intentos de 20 s + 2 esperas de 5 s = 70 s.
        timeout-duration: 70s
        cancel-running-future: true
      materialesVerificacion:
        timeout-duration: 5s
        cancel-running-future: true
      fuentePatentes:
        timeout-duration: 70s
        cancel-running-future: true
  circuitbreaker:
    instances:
      materiales:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        record-exceptions:
          - co.edu.univalle.patentsweep.exception.ServicioNoDisponibleException
      materialesVerificacion:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        record-exceptions:
          - co.edu.univalle.patentsweep.exception.ServicioNoDisponibleException
      fuentePatentes:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        record-exceptions:
          - co.edu.univalle.patentsweep.exception.ServicioNoDisponibleException
