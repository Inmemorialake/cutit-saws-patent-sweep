spring:
  application:
    name: patent-sweep
  config:
    import: "optional:file:.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${API_PUERTO}
  error:
    include-stacktrace: never
    include-message: never

# Documentación OpenAPI (P24): Swagger UI en /swagger-ui.html y contrato en /v3/api-docs.
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Actuator + Micrometer (P23, P28): health check y métricas para Prometheus.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0

# traceId en cada línea de log (P19).
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
