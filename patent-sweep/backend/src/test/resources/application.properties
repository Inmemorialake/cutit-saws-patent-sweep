# Valores ficticios solo para las pruebas: reemplazan las variables de entorno que exige application.yml.
spring.profiles.active=test
server.port=0
spring.datasource.url=jdbc:postgresql://localhost/prueba
spring.datasource.username=prueba
spring.datasource.password=prueba
spring.flyway.enabled=false

# Secreto de prueba con longitud suficiente para HS256 (nunca usar en producción).
patentsweep.seguridad.jwt-secreto=clave-de-prueba-de-al-menos-32-caracteres
patentsweep.seguridad.jwt-expiracion-minutos=60
patentsweep.materiales.url-base=http://localhost:8080
patentsweep.fuente-patentes.url-base=http://localhost:8080

# Las pruebas de contexto no deben lanzar el barrido de arranque en segundo plano.
patentsweep.barrido.al-iniciar=false
